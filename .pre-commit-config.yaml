# Ganchos de seguranca e qualidade (so CONFEREM; nenhum reformata o codigo sozinho).
# Ativar:  pip install pre-commit  &&  pre-commit install
# Executar em tudo:  pre-commit run --all-files
# O CI roda o mesmo gitleaks (binario fixo, verificado por sha256) em todo push e pull request.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks  # varre o que vai ser commitado em busca de segredos (tokens, chaves, senhas)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff  # lint (sem --fix: nada e alterado sem voce ver)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: check-merge-conflict
