# Scanners de seguranca e qualidade. NAO instalado automaticamente (requer aprovacao: instala software).
# Para ativar (apos aprovacao):  pip install pre-commit  &&  pre-commit install
# Executar manualmente em tudo:  pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: check-merge-conflict
