[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forja"
version = "0.1.0"
description = "Forja: orquestrador local-first de engenharia com Kiro como provedor principal (Fase 1: nucleo deterministico)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi==0.138.0",
  "uvicorn==0.49.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "SQLAlchemy==2.0.41",
  "alembic==1.16.5",
  "psutil==7.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "httpx==0.28.1",
  "ruff==0.15.21",
]

[tool.setuptools.packages.find]
include = ["forja*"]

[tool.setuptools.package-data]
forja = ["painel/estatico/*", "migrations/*.ini", "migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:forja.*",
  # vazamento de conexao/arquivo/pipe e falha de teste (regressao de higiene de recursos)
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501"]
"scripts/**" = ["S603", "S607"]
