<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <title>Forja — orquestrador local</title>
  <link rel="icon" href="/estatico/icone.svg" type="image/svg+xml" />
  <link rel="manifest" href="/estatico/manifest.webmanifest" />
  <meta name="theme-color" content="#181818" />
  <link rel="stylesheet" href="/estatico/tema.css" />
  <link rel="stylesheet" href="/estatico/app.css" />
</head>
<body data-nivel="simples">
  <a class="pular" href="#principal">Pular para o conteúdo</a>

  <header id="barra-titulo" role="banner">
    <strong class="marca">Forja</strong>
    <span class="subtitulo">orquestrador local</span>
    <span class="espaco"></span>
    <button id="atalho-precisa" type="button" class="chip" hidden aria-label="Itens que precisam de você"></button>
    <label class="chip-rotulo" for="nivel">Detalhe
      <select id="nivel" aria-describedby="nivel-ajuda">
        <option value="simples">Simples</option>
        <option value="avancado">Avançado</option>
      </select>
    </label>
    <span id="nivel-ajuda" class="sr-only">Simples esconde campos técnicos; Avançado mostra tudo.</span>
    <button id="alternar-lateral" type="button" aria-pressed="false" aria-controls="lateral" title="Menu lateral (Ctrl+B)">Menu</button>
    <button id="alternar-direita" type="button" aria-pressed="false" aria-controls="direita" title="Conversa e decisões (Ctrl+Shift+B)">Conversa</button>
    <button id="alternar-inferior" type="button" aria-pressed="false" aria-controls="inferior" title="Painel inferior (Ctrl+J)">Painel</button>
    <button id="usuario-atual" type="button" class="chip" hidden aria-label="Sua conta"></button>
    <span id="conexao" role="status" aria-live="polite" class="pill">desconectado</span>
  </header>

  <div id="area" data-lateral="off" data-direita="off" data-inferior="off">
    <nav id="atividades" aria-label="Áreas do orquestrador"></nav>
    <main id="principal" tabindex="-1"></main>
    <aside id="lateral" aria-label="Menu lateral" inert></aside>
    <aside id="direita" aria-label="Conversa e decisões" inert>
      <div class="cabeca-painel">
        <div role="tablist" aria-label="Painel de conversa" id="direita-abas"></div>
        <button type="button" class="fechar" data-fechar="direita" aria-label="Fechar conversa" title="Fechar (Esc)">✕</button>
      </div>
      <div id="direita-corpo" tabindex="0" aria-label="Conteudo da conversa"></div>
    </aside>
    <section id="inferior" aria-label="Painel inferior" inert>
      <div class="cabeca-painel">
        <div role="tablist" aria-label="Painel inferior" id="inferior-abas"></div>
        <button type="button" class="fechar" data-fechar="inferior" aria-label="Fechar painel inferior" title="Fechar (Esc)">✕</button>
      </div>
      <div id="inferior-corpo" tabindex="0" aria-label="Conteudo do painel inferior"></div>
    </section>
  </div>

  <footer id="barra-status" role="contentinfo">
    <span id="st-config">config —</span>
    <span id="st-modelo">modelo —</span>
    <span class="espaco"></span>
    <span id="st-tokens" title="Tokens exibidos são estimativas (~4 caracteres por token)">tokens estimados</span>
    <span id="st-hora"></span>
  </footer>

  <div id="tela-login" hidden></div>
  <dialog id="dlg-geral" aria-labelledby="dlg-geral-t"><div id="dlg-geral-corpo"></div></dialog>
  <div id="avisos" role="status" aria-live="polite" popover="manual"></div>

  <script src="/estatico/js/main.js" type="module"></script>
</body>
</html>
