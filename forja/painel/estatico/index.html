<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <title>Forja — orquestrador local</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/estatico/app.css" />
</head>
<body data-nivel="simples">
  <a class="pular" href="#principal">Pular para o conteúdo</a>

  <header id="barra-titulo" role="banner">
    <strong class="marca">Forja</strong>
    <span class="subtitulo">orquestrador local</span>
    <span class="espaco"></span>
    <button id="atalho-precisa" type="button" class="chip" hidden aria-label="Itens que precisam de você"></button>
    <label class="chip-rotulo" for="nivel">Detalhe
      <select id="nivel" aria-describedby="nivel-ajuda">
        <option value="simples">Simples</option>
        <option value="avancado">Avançado</option>
      </select>
    </label>
    <span id="nivel-ajuda" class="sr-only">Simples esconde campos técnicos; Avançado mostra tudo.</span>
    <button id="alternar-lateral" type="button" aria-pressed="true" title="Barra lateral (Ctrl+B)">Lateral</button>
    <button id="alternar-direita" type="button" aria-pressed="false" title="Conversa e decisões (Ctrl+Shift+B)">Conversa</button>
    <button id="alternar-inferior" type="button" aria-pressed="true" title="Painel inferior (Ctrl+J)">Painel</button>
    <span id="conexao" role="status" aria-live="polite" class="pill">desconectado</span>
  </header>

  <div id="area" data-direita="off">
    <nav id="atividades" aria-label="Áreas do orquestrador"></nav>
    <aside id="lateral" aria-label="Barra lateral"></aside>
    <main id="principal" tabindex="-1"></main>
    <aside id="direita" aria-label="Conversa e decisões">
      <div role="tablist" aria-label="Painel de conversa" id="direita-abas"></div>
      <div id="direita-corpo"></div>
    </aside>
    <section id="inferior" aria-label="Painel inferior">
      <div role="tablist" aria-label="Painel inferior" id="inferior-abas"></div>
      <div id="inferior-corpo"></div>
    </section>
  </div>

  <footer id="barra-status" role="contentinfo">
    <span id="st-config">config —</span>
    <span id="st-modelo">modelo —</span>
    <span class="espaco"></span>
    <span id="st-tokens" title="Tokens exibidos são estimativas (~4 caracteres por token)">tokens estimados</span>
    <span id="st-hora"></span>
  </footer>

  <dialog id="dlg-token" aria-labelledby="dlg-token-t">
    <form method="dialog" id="form-token">
      <h2 id="dlg-token-t">Acesso</h2>
      <p class="aviso">Servidor local-first. Informe o token da API (arquivo <code>data/api_token.txt</code>).
        Ele fica só nesta aba e nunca é versionado.</p>
      <label>Token <input id="token" type="password" autocomplete="off" required /></label>
      <div class="linha"><button value="ok" id="salvar-token">Usar token</button></div>
    </form>
  </dialog>
  <dialog id="dlg-geral" aria-labelledby="dlg-geral-t"><div id="dlg-geral-corpo"></div></dialog>
  <div id="avisos" role="status" aria-live="polite"></div>

  <script src="/estatico/js/main.js" type="module"></script>
</body>
</html>
