name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # nenhum segredo e nenhuma escrita: o CI so le o codigo e roda com dados sinteticos

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04  # fixo: o Playwright 1.52 so instala dependencias de sistema em versoes conhecidas do Ubuntu
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # historico inteiro: o gitleaks varre todos os commits, nao so o ultimo
      - name: Segredos (gitleaks, binario fixo verificado por sha256)
        env:
          GITLEAKS_VERSAO: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          arq="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$arq" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/$arq"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$arq" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$arq" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias (versoes fixas)
        run: pip install -r requirements-ui.txt
      - name: Lint
        run: python -m ruff check forja tests scripts
      - name: Testes
        run: python -m pytest -p no:cacheprovider -q --junitxml="$RUNNER_TEMP/junit.xml" || { python scripts/ci_anotar.py "$RUNNER_TEMP/junit.xml"; exit 1; }
      - name: Navegador do Playwright
        run: python -m playwright install --with-deps chromium
      - name: Painel em navegador real (interacoes, layout estreito, acessibilidade)
        env:
          APP_DATA_DIR: ${{ runner.temp }}/forja/data
          APP_LOG_DIR: ${{ runner.temp }}/forja/logs
          APP_REQUIRE_AUTH: "false"
          APP_PORT: "8799"
          APP_KIRO_ACP_ENABLED: "false"
          APP_RATE_LIMIT_PER_MINUTE: "3000"
          FORJA_INT_DEMO_TRELLO_KEY: chave-ficticia-ci
          FORJA_INT_DEMO_TRELLO_TOKEN: token-ficticio-ci
        run: |
          python -m forja > "$RUNNER_TEMP/servidor.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8799/api/v1/saude > /dev/null && break; sleep 0.5; done
          python scripts/semear_demo.py --porta 8799
          python scripts/inspecionar_painel.py --porta 8799 --saida "$RUNNER_TEMP/capturas" --navegador chromium --interagir --a11y
      - name: Capturas e relatorio de acessibilidade
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: painel
          path: ${{ runner.temp }}/capturas
          retention-days: 7
